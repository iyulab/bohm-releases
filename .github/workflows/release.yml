# Builds, signs and (optionally) drafts a Bohm release. Run by hand only.
#
# Signing uses iyulab/code-sign (Azure Key Vault, OIDC). This repository's OIDC subject includes the
# calling workflow (`include_claim_keys`: repo · context · job_workflow_ref — read it with
#   gh api repos/iyulab/bohm-releases/actions/oidc/customization/sub ), and the federated credential
# matches only `<sub_claim_prefix>:environment:production:job_workflow_ref:iyulab/code-sign/*`: a
# token is issued to a job run through code-sign's signing workflow, not to any job of this repository
# that names the production environment.
#
# The build runs here, without any credential. Everything after it is iyulab/tauri-release's reusable
# Windows workflow (pinned to a commit): it signs exactly the files in SIGN_BINARIES, bundles twice so the
# uninstaller and the NSIS plugins are signed too, signs the installer, installs it and checks every
# installed file's signature, and drafts the release. Only its signing jobs hold the signing credential —
# they are code-sign's reusable workflow, which runs nothing of this repository.
#
#   build (no credential) → release: sign-binaries → bundle ×2 → sign-installer → verify → draft
#
# macOS (Apple silicon) goes the same way: the bundle is built here without any credential, ad hoc, and handed to
# the organization's signing Mac, which signs it with a Developer ID, notarizes it and attaches the disk image and
# the update archive to the draft the Windows call made (a private repository's workflow does it — see `macos-sign` below).
#
#   macos-build (no credential) → macos-sign: dispatch, wait → the draft holds the Windows installer and the macOS files
#
# Every action is pinned to a commit; the tag it was taken from is in the trailing comment.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to build
        default: main
      draft-release:
        description: Create a draft GitHub Release from the signed installer
        type: boolean
        default: false

permissions: {}

env:
  # Files that go into the installer and are signed by us, relative to the source root. The build fails
  # if scripts/package.ps1 -Phase build names a different set — update this list with a deliberate review.
  SIGN_BINARIES: |
    bohm-browser/target/release/bohm-browser.exe
    bohm-browser/target/stage/runtime/Bohm.Runtime.Host.exe
    bohm-browser/target/stage/runtime/llama-server/ggml-base.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-alderlake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-cannonlake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-cascadelake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-cooperlake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-haswell.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-icelake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-ivybridge.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-piledriver.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-sandybridge.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-sapphirerapids.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-skylakex.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-sse42.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-x64.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-zen4.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-rpc.dll
    bohm-browser/target/stage/runtime/llama-server/ggml.dll
    bohm-browser/target/stage/runtime/llama-server/libomp.dll
    bohm-browser/target/stage/runtime/llama-server/llama-common.dll
    bohm-browser/target/stage/runtime/llama-server/llama-server-impl.dll
    bohm-browser/target/stage/runtime/llama-server/llama-server.exe
    bohm-browser/target/stage/runtime/llama-server/llama.dll
    bohm-browser/target/stage/runtime/llama-server/mtmd.dll

jobs:
  # 1) Build the runtime and the desktop program (unsigned). No signing credential here.
  build:
    runs-on: windows-latest        # the desktop program and its runtime are Windows builds
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sign-binaries: ${{ steps.version.outputs.sign-binaries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iyulab/bohm-works
          ref: ${{ inputs.ref }}
          path: src
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false   # the token is needed only to fetch; later steps must not read it

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Third-party notices are generated during the build and double as a license gate.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/bohm-browser/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - id: version
        shell: pwsh
        run: |
          $v = (Get-Content src/bohm-browser/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          # The signing workflow is called with `with:`, which cannot read `env` — hand it the list as an output.
          "sign-binaries<<EOF" >> $env:GITHUB_OUTPUT
          @($env:SIGN_BINARIES -split "`n" | ForEach-Object Trim | Where-Object { $_ }) >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - id: build
        shell: pwsh
        # Where the desktop program sends its diagnostics (an ingestion connection string, compiled in).
        # Without it the build still succeeds and the installer sends no diagnostics.
        env:
          BOHM_DIAGNOSTICS: ${{ secrets.BOHM_DIAGNOSTICS }}
        run: ./src/scripts/package.ps1 -Phase build

      # Hand the signing job exactly the files to sign, and bundling what it reads: the shell sources
      # (tracked files only), the built program, and the staged runtime and licenses.
      - name: Stage for signing and bundling
        shell: pwsh
        env:
          BUILT: ${{ steps.build.outputs.files }}
        run: |
          $src = (Resolve-Path src).Path
          $lines = { param($text) @($text -split "`n" | ForEach-Object Trim | Where-Object { $_ }) }
          $expected = & $lines $env:SIGN_BINARIES | Sort-Object
          $built = & $lines $env:BUILT | ForEach-Object { [IO.Path]::GetRelativePath($src, $_).Replace('\', '/') } | Sort-Object
          $diff = Compare-Object $expected $built
          if ($diff) { throw "The build names other files to sign than SIGN_BINARIES:`n$($diff | Out-String)" }

          $unsigned = Join-Path $env:RUNNER_TEMP 'unsigned-binaries'
          foreach ($f in $expected) {
            $to = Join-Path $unsigned $f
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            Copy-Item (Join-Path $src $f) $to
          }

          $bundleIn = Join-Path $env:RUNNER_TEMP 'bundle-input'
          $shell = Join-Path $bundleIn 'bohm-browser'
          New-Item -ItemType Directory -Force (Join-Path $shell 'target/release'), (Join-Path $shell 'target/stage') | Out-Null
          $tar = Join-Path $env:RUNNER_TEMP 'shell.tar'
          git -C src/bohm-browser archive --format=tar -o $tar HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          tar -xf $tar -C $shell
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          Copy-Item src/bohm-browser/target/release/bohm-browser.exe (Join-Path $shell 'target/release')
          Copy-Item src/bohm-browser/target/stage/runtime, src/bohm-browser/target/stage/licenses (Join-Path $shell 'target/stage') -Recurse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries
          path: ${{ runner.temp }}/unsigned-binaries
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-input
          path: ${{ runner.temp }}/bundle-input
          if-no-files-found: error
          retention-days: 1

  # 2) Sign, bundle, check and draft — tauri-release, with signing in code-sign's jobs only.
  release:
    needs: build
    uses: iyulab/tauri-release/.github/workflows/windows.yml@b8cb5dd95167e46f7474e6d498c1dd422651ad22
    permissions:
      id-token: write      # its three signing jobs
      contents: write      # its draft job, only with draft-release
    with:
      unsigned-artifact: unsigned-binaries
      files: ${{ needs.build.outputs.sign-binaries }}
      bundle-artifact: bundle-input
      app-dir: bohm-browser
      tauri-cli: '@tauri-apps/cli@2.12.1'   # the same as scripts/package.ps1
      installer-artifact: bohm-setup
      draft: ${{ inputs.draft-release }}
      tag: v${{ needs.build.outputs.version }}
      title: Bohm ${{ needs.build.outputs.version }}
      notes: Bohm ${{ needs.build.outputs.version }} for Windows (x64).
      # The same signed installer a second time under a version-free name, so
      # releases/latest/download/Bohm-x64-setup.exe always starts the newest download directly.
      alias: Bohm-x64-setup.exe

  # 3) The macOS bundle (ad hoc, no signing credential). Signing and notarizing are the signing Mac's.
  macos-build:
    runs-on: macos-latest          # the app bundle and its helpers are macOS (arm64) builds
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iyulab/bohm-works
          ref: ${{ inputs.ref }}
          path: src
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false   # the token is needed only to fetch; later steps must not read it

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Third-party notices are generated during the build and double as a license gate.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/bohm-browser/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - id: version
        shell: pwsh
        run: |
          $v = (Get-Content src/bohm-browser/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      # No Apple credential is set, so the bundle is signed ad hoc (the build script says so) and the disk image it
      # also makes is thrown away: only the bundle goes on, as a tar archive — an uploaded folder would lose the
      # symbolic links and modes a bundle needs.
      - id: build
        shell: pwsh
        env:
          BOHM_DIAGNOSTICS: ${{ secrets.BOHM_DIAGNOSTICS }}
        run: ./src/scripts/package.ps1

      - name: Stage for signing
        run: |
          mkdir -p macos-input/entitlements
          tar -cf macos-input/Bohm.app.tar -C src/bohm-browser/target/release/bundle/macos Bohm.app
          cp src/bohm-browser/macos/*.entitlements macos-input/entitlements/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bundle
          path: macos-input
          if-no-files-found: error
          retention-days: 1

  # 4) Sign, notarize and attach — done by the organization's signing Mac (see the header). It needs the draft the
  # Windows call made, so it runs after `release`. The pinned workflow only starts the signing and waits for it.
  macos-sign:
    if: ${{ inputs.draft-release }}       # it attaches to the draft; without one there is nothing to attach to
    needs: [release, macos-build]
    uses: iyulab/tauri-release/.github/workflows/macos-signed.yml@ff6a440080a62923492ba6605e4b3a6fd9820558 # unreleased
    permissions: {}
    secrets: inherit                      # RELEASE_BOT_PRIVATE_KEY (organization secret)
    with:
      version: ${{ needs.macos-build.outputs.version }}

  # The installer keeps the name the site and the updater ask for.
  installer-name:
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          GOT: ${{ needs.release.outputs.installer }}
          WANT: Bohm_${{ needs.build.outputs.version }}_x64-setup.exe
        run: '[ "$GOT" = "$WANT" ] || { echo "installer is $GOT, expected $WANT" >&2; exit 1; }'

  # This run's own artifacts are not kept past it (tauri-release removes its own).
  cleanup:
    if: ${{ always() }}
    needs: [build, release, macos-build, macos-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            unsigned-binaries
            bundle-input
            macos-bundle
          failOnError: false
