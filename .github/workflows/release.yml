# Builds, signs and (optionally) drafts a Bohm release. Run by hand only.
#
# Signing uses iyulab/code-sign (Azure Key Vault, OIDC). The federated credential's subject is this
# repository's immutable form — read it with
#   gh api repos/iyulab/bohm-releases/actions/oidc/customization/sub   (sub_claim_prefix)
# and append ":environment:production".
#
# Only the two signing jobs hold the signing credential (environment production + id-token: write), and
# they run nothing but first-party artifact actions and the signing action: no checkout, no toolchain, no
# build scripts. Build and bundle run without it, so a compromised dependency or build step cannot reach
# the credential. A signing job signs only the files named in SIGN_BINARIES (or the one installer) and
# fails on any other file in its input, so a build cannot hand it something else to sign.
#
#   build (no credential) → sign-binaries → bundle (no credential) → sign-installer → draft-release
#
# Every action is pinned to a commit; the tag it was taken from is in the trailing comment.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to build
        default: main
      draft-release:
        description: Create a draft GitHub Release from the signed installer
        type: boolean
        default: false

permissions: {}

env:
  # Files that go into the installer and are signed by us, relative to the source root. The build fails
  # if scripts/package.ps1 -Phase build names a different set — update this list with a deliberate review.
  SIGN_BINARIES: |
    bohm-browser/target/release/bohm-browser.exe
    bohm-browser/target/stage/runtime/Bohm.Runtime.Host.exe
    bohm-browser/target/stage/runtime/llama-server/ggml-base.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-alderlake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-cannonlake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-cascadelake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-cooperlake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-haswell.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-icelake.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-ivybridge.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-piledriver.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-sandybridge.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-sapphirerapids.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-skylakex.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-sse42.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-x64.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-cpu-zen4.dll
    bohm-browser/target/stage/runtime/llama-server/ggml-rpc.dll
    bohm-browser/target/stage/runtime/llama-server/ggml.dll
    bohm-browser/target/stage/runtime/llama-server/libomp.dll
    bohm-browser/target/stage/runtime/llama-server/llama-common.dll
    bohm-browser/target/stage/runtime/llama-server/llama-server-impl.dll
    bohm-browser/target/stage/runtime/llama-server/llama-server.exe
    bohm-browser/target/stage/runtime/llama-server/llama.dll
    bohm-browser/target/stage/runtime/llama-server/mtmd.dll

jobs:
  # 1) Build the runtime and the desktop program (unsigned). No signing credential here.
  build:
    runs-on: windows-latest        # the desktop program and its runtime are Windows builds
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iyulab/bohm-works
          ref: ${{ inputs.ref }}
          path: src
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false   # the token is needed only to fetch; later steps must not read it

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Third-party notices are generated during the build and double as a license gate.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/bohm-browser/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - id: version
        shell: pwsh
        run: |
          $v = (Get-Content src/bohm-browser/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - id: build
        shell: pwsh
        # Where the desktop program sends its diagnostics (an ingestion connection string, compiled in).
        # Without it the build still succeeds and the installer sends no diagnostics.
        env:
          BOHM_DIAGNOSTICS: ${{ secrets.BOHM_DIAGNOSTICS }}
        run: ./src/scripts/package.ps1 -Phase build

      # Hand the signing job exactly the files to sign, and the bundle job what bundling reads: the shell
      # sources (tracked files only), the built program, the staged runtime and licenses, and the script.
      - name: Stage for signing and bundling
        shell: pwsh
        env:
          BUILT: ${{ steps.build.outputs.files }}
        run: |
          $src = (Resolve-Path src).Path
          $lines = { param($text) @($text -split "`n" | ForEach-Object Trim | Where-Object { $_ }) }
          $expected = & $lines $env:SIGN_BINARIES | Sort-Object
          $built = & $lines $env:BUILT | ForEach-Object { [IO.Path]::GetRelativePath($src, $_).Replace('\', '/') } | Sort-Object
          $diff = Compare-Object $expected $built
          if ($diff) { throw "The build names other files to sign than SIGN_BINARIES:`n$($diff | Out-String)" }

          $unsigned = Join-Path $env:RUNNER_TEMP 'unsigned-binaries'
          foreach ($f in $expected) {
            $to = Join-Path $unsigned $f
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            Copy-Item (Join-Path $src $f) $to
          }

          $bundleIn = Join-Path $env:RUNNER_TEMP 'bundle-input'
          $shell = Join-Path $bundleIn 'bohm-browser'
          New-Item -ItemType Directory -Force (Join-Path $shell 'target/release'), (Join-Path $shell 'target/stage'), (Join-Path $bundleIn 'scripts') | Out-Null
          $tar = Join-Path $env:RUNNER_TEMP 'shell.tar'
          git -C src/bohm-browser archive --format=tar -o $tar HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          tar -xf $tar -C $shell
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          Copy-Item src/bohm-browser/target/release/bohm-browser.exe (Join-Path $shell 'target/release')
          Copy-Item src/bohm-browser/target/stage/runtime, src/bohm-browser/target/stage/licenses (Join-Path $shell 'target/stage') -Recurse
          Copy-Item src/scripts/package.ps1 (Join-Path $bundleIn 'scripts')

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries
          path: ${{ runner.temp }}/unsigned-binaries
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-input
          path: ${{ runner.temp }}/bundle-input
          if-no-files-found: error
          retention-days: 1

  # 2) Sign the binaries that go into the installer. Holds the signing credential; runs nothing else.
  sign-binaries:
    needs: build
    runs-on: windows-latest        # Authenticode signing and its verification run on Windows
    timeout-minutes: 20
    environment: production        # the OIDC federated credential requires this environment
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-binaries
          path: bin

      - id: files
        name: Accept exactly the files this workflow signs
        shell: pwsh
        run: |
          $root = (Resolve-Path bin).Path
          $expected = @($env:SIGN_BINARIES -split "`n" | ForEach-Object Trim | Where-Object { $_ }) | Sort-Object
          $present = Get-ChildItem $root -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/') } | Sort-Object
          $diff = Compare-Object $expected $present
          if ($diff) { throw "The input is not exactly SIGN_BINARIES:`n$($diff | Out-String)" }
          "files<<EOF" >> $env:GITHUB_OUTPUT
          $expected | ForEach-Object { Join-Path $root $_ } >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - uses: iyulab/code-sign@693f7261b2e4aef517ff8972db7d07eb53ffc623
        with:
          files: ${{ steps.files.outputs.files }}

      - name: Verify signatures
        shell: pwsh
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          $files = @($env:FILES -split "`n" | ForEach-Object Trim | Where-Object { $_ })
          $bad = $files | Where-Object { (Get-AuthenticodeSignature $_).Status -ne 'Valid' }
          if ($bad) { throw "Missing or invalid signature: $($bad -join ', ')" }
          Write-Host "Signatures valid: $($files.Count) files"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-binaries
          path: bin
          if-no-files-found: error
          retention-days: 1

  # 3) Build the installer from the signed binaries. No signing credential here.
  # Known gap: the uninstaller embedded in the installer is not signed — the bundler can sign it only
  # mid-bundle, which would bring the signing credential into this job.
  bundle:
    needs: [build, sign-binaries]
    runs-on: windows-latest        # the installer is built with the Windows NSIS bundler
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-input
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-binaries
          path: signed

      # The bundler reads the crate's metadata through cargo; nothing is compiled here.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Put the signed binaries in place
        shell: pwsh
        run: |
          foreach ($f in @($env:SIGN_BINARIES -split "`n" | ForEach-Object Trim | Where-Object { $_ })) {
            Copy-Item (Join-Path signed $f) (Join-Path src $f) -Force
          }

      - id: bundle
        shell: pwsh
        run: ./src/scripts/package.ps1 -Phase bundle

      # The installer must carry the signed binaries as they were signed — read them back out of it.
      - name: Check the installer carries valid signatures
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUNDLED: ${{ steps.bundle.outputs.files }}
        run: |
          $setup = @($env:BUNDLED -split "`n" | ForEach-Object Trim | Where-Object { $_ })
          if ($setup.Count -ne 1 -or (Split-Path $setup[0] -Leaf) -ne "Bohm_${env:VERSION}_x64-setup.exe") { throw "Unexpected bundle output: $($setup -join ', ')" }
          $out = Join-Path $env:RUNNER_TEMP 'unpacked'
          7z x -y "-o$out" $setup[0] | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z failed' }
          $inside = @($env:SIGN_BINARIES -split "`n" | ForEach-Object Trim | Where-Object { $_ }) | ForEach-Object {
            $_ -replace '^bohm-browser/target/release/', '' -replace '^bohm-browser/target/stage/runtime/', 'runtime/'
          }
          $bad = $inside | Where-Object { $p = Join-Path $out $_; -not (Test-Path $p) -or (Get-AuthenticodeSignature $p).Status -ne 'Valid' }
          if ($bad) { throw "Missing or invalid signature inside the installer: $($bad -join ', ')" }
          Write-Host "Signatures valid inside the installer: $($inside.Count) files"
          $stage = Join-Path $env:RUNNER_TEMP 'unsigned-installer'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $setup[0] $stage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: ${{ runner.temp }}/unsigned-installer
          if-no-files-found: error
          retention-days: 1

  # 4) Sign the installer. Holds the signing credential; runs nothing else.
  sign-installer:
    needs: [build, bundle]
    runs-on: windows-latest        # Authenticode signing and its verification run on Windows
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-installer
          path: dist

      - id: files
        name: Accept exactly the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $present = @(Get-ChildItem dist -Recurse -File)
          $name = "Bohm_${env:VERSION}_x64-setup.exe"
          if ($present.Count -ne 1 -or $present[0].Name -ne $name -or $present[0].Directory.FullName -ne (Resolve-Path dist).Path) {
            throw "The input is not exactly $name : $($present.FullName -join ', ')"
          }
          "file=$($present[0].FullName)" >> $env:GITHUB_OUTPUT

      - uses: iyulab/code-sign@693f7261b2e4aef517ff8972db7d07eb53ffc623
        with:
          files: ${{ steps.files.outputs.file }}

      - name: Verify signature
        shell: pwsh
        env:
          FILE: ${{ steps.files.outputs.file }}
        run: |
          $status = (Get-AuthenticodeSignature $env:FILE).Status
          if ($status -ne 'Valid') { throw "Installer signature: $status" }
          Write-Host "Signature valid: $env:FILE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bohm-setup
          path: dist
          if-no-files-found: error
          retention-days: 1

  draft-release:
    if: ${{ inputs.draft-release }}
    needs: [build, sign-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bohm-setup
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        # The same signed installer is attached a second time under a version-free name, so
        # releases/latest/download/Bohm-x64-setup.exe always starts the newest download directly.
        run: |
          cp "dist/Bohm_${VERSION}_x64-setup.exe" dist/Bohm-x64-setup.exe
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Bohm $VERSION" --notes "Bohm $VERSION for Windows (x64)."
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: bohm-setup

  # Intermediate artifacts are not kept past the run (the signed installer stays a day when no draft is made).
  cleanup:
    if: ${{ always() }}
    needs: [build, sign-binaries, bundle, sign-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            unsigned-binaries
            bundle-input
            signed-binaries
            unsigned-installer
          failOnError: false
